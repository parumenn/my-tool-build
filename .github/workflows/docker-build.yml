name: Build and Push Docker Image
on:
  push:
    branches:
      - master
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/parumenn/my-tool-build:latest
            ghcr.io/parumenn/my-tool-build:${{ github.sha }}

      - name: Build and push collab server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: collab-server/Dockerfile
          push: true
          tags: |
            ghcr.io/parumenn/my-tool-collab:latest
            ghcr.io/parumenn/my-tool-collab:${{ github.sha }}

      - name: Update Manifest Repository
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_TOKEN }}@github.com/parumenn/my-tool-manifest.git
          cd my-tool-manifest
          sed -i "s|image: ghcr.io/parumenn/my-tool-build:.*|image: ghcr.io/parumenn/my-tool-build:${{ github.sha }}|g" my-tool.yaml
          sed -i "s|image: ghcr.io/parumenn/my-tool-collab:.*|image: ghcr.io/parumenn/my-tool-collab:${{ github.sha }}|g" collab.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-tool.yaml collab.yaml
          git commit -m "auto-update: my-tool image tag to ${{ github.sha }}"
          git push
